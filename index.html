<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday English</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Ethiopic:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2d3748;
            --muted: #718096;
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --success: #2ecc71;
            --success-bg: #e8f8f0;
            --success-text: #1e7e34;
            --error: #e74c3c;
            --error-bg: #fde8e8;
            --error-text: #bd2130;
            --border: #e2e8f0;
            --soft: #ebf8ff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans', 'Noto Sans Arabic', 'Noto Sans Ethiopic', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            max-width: 680px;
            width: 100%;
            padding: 24px;
            align-self: flex-start;
        }

        .hidden { display: none !important; }

        /* Translated text: right-to-left handled automatically */
        .tr {
            display: block;
            font-size: 0.9em;
            color: var(--muted);
            unicode-bidi: plaintext;
        }

        /* ---------- Language and level screens ---------- */
        .screen-title {
            text-align: center;
            font-size: 1.6rem;
            margin: 0 0 6px;
        }
        .screen-title .tr { font-size: 0.7em; font-weight: 400; }
        .screen-sub {
            text-align: center;
            color: var(--muted);
            margin: 0 0 22px;
            line-height: 1.7;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .choice-btn {
            font-family: inherit;
            background: var(--soft);
            border: 2px solid var(--primary);
            color: var(--text);
            border-radius: 12px;
            padding: 16px 12px;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, transform 0.1s;
        }
        .choice-btn:hover { background: #d6ecff; }
        .choice-btn:active { transform: scale(0.98); }
        .choice-btn .big { display: block; font-size: 1.35rem; font-weight: 600; }
        .choice-btn .small { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
        .choice-btn .icon { display: block; font-size: 2rem; margin-bottom: 4px; }
        .back-link {
            display: block;
            margin: 18px auto 0;
            font-family: inherit;
            background: none;
            border: none;
            color: var(--primary-dark);
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* ---------- Quiz header ---------- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .top-bar h1 { font-size: 1.5rem; margin: 0; color: #1a202c; }
        .top-actions { display: flex; gap: 8px; }
        .pill-btn {
            font-family: inherit;
            background: none;
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text);
            white-space: nowrap;
        }
        .pill-btn:hover { border-color: var(--primary); }

        .instruction {
            font-size: 1.05rem;
            margin: 0 0 14px;
            line-height: 1.6;
        }

        /* ---------- Topic chips ---------- */
        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .topic-chip {
            font-family: inherit;
            border: 2px solid var(--border);
            background: #fff;
            border-radius: 20px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.3;
            text-align: center;
        }
        .topic-chip .tr { font-size: 0.8rem; }
        .topic-chip.active {
            border-color: var(--primary);
            background: var(--soft);
            font-weight: 600;
        }

        /* ---------- Word bank ---------- */
        .word-bank {
            background: var(--soft);
            border: 1px dashed var(--primary);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 22px;
        }
        .word-bank-label {
            text-align: center;
            margin: 0 0 10px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .word-bank-label .tr { text-transform: none; letter-spacing: 0; font-weight: 400; }
        .word-tags {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .word-tag {
            font-family: inherit;
            background: #fff;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s;
        }
        .word-tag:hover { background: #f0f8ff; }
        .word-tag .emoji { font-size: 2rem; display: block; line-height: 1.2; }
        .word-tag .word { font-size: 1.15rem; font-weight: 700; display: block; color: var(--primary-dark); }
        .word-tag .tr { margin-top: 2px; }
        .word-tag .speak-hint { font-size: 0.8rem; color: var(--muted); }

        /* ---------- Sentences ---------- */
        .sentence-block {
            border-bottom: 1px solid var(--border);
            padding: 12px 0 16px;
        }
        .sentence-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 1.25rem;
            line-height: 1.6;
        }
        .level-intermediate .sentence-row { font-size: 1.1rem; }
        .num { font-weight: 700; color: var(--muted); }
        .speak-btn {
            font-family: inherit;
            border: 2px solid var(--border);
            background: #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .speak-btn:hover { border-color: var(--primary); }

        select {
            font-family: inherit;
            font-size: 1.1rem;
            padding: 6px 8px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
            min-width: 140px;
        }
        select:focus { border-color: var(--primary); outline: none; }
        select.correct { border-color: var(--success); background: var(--success-bg); color: var(--success-text); }
        select.incorrect { border-color: var(--error); background: var(--error-bg); color: var(--error-text); }

        .feedback {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .feedback.ok { display: block; background: var(--success-bg); color: var(--success-text); border-left: 4px solid var(--success); }
        .feedback.bad { display: block; background: #f8fafc; color: #4a5568; border-left: 4px solid var(--error); }
        .feedback .hint { display: block; margin-top: 4px; color: #4a5568; }

        /* ---------- Buttons ---------- */
        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .action {
            font-family: inherit;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            min-width: 130px;
            cursor: pointer;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.3;
            transition: background 0.15s, transform 0.1s;
        }
        .action .tr { color: rgba(255,255,255,0.9); font-weight: 400; font-size: 0.85rem; }
        .action:active { transform: scale(0.98); }
        .action.check { background: var(--primary); }
        .action.check:hover { background: var(--primary-dark); }
        .action.reset { background: #a0aec0; }
        .action.reset:hover { background: #718096; }
        .action.fresh { background: #38a169; }
        .action.fresh:hover { background: #2f855a; }

        .result {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 1.15rem;
            line-height: 1.5;
        }
        .result.all { display: block; background: var(--success-bg); color: var(--success-text); }
        .result.some { display: block; background: #fffaf0; color: #dd6b20; }
        .result .tr { color: inherit; font-weight: 400; }

        @media (max-width: 480px) {
            .container { padding: 18px 16px; }
            .top-bar h1 { font-size: 1.25rem; }
            .sentence-row { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Step 1: language -->
    <div id="lang-screen">
        <h2 class="screen-title">🌍 Choose your language</h2>
        <p class="screen-sub">

        </p>
        <div class="choice-grid" id="lang-grid"></div>
    </div>

    <!-- Step 2: level -->
    <div id="level-screen" class="hidden">
        <h2 class="screen-title" id="level-title"></h2>
        <div class="choice-grid" id="level-grid"></div>
        <button type="button" class="back-link" id="level-back">🌐 Language</button>
    </div>

    <!-- Quiz -->
    <div id="quiz-screen" class="hidden">
        <div class="top-bar">
            <h1>Everyday English</h1>
            <div class="top-actions">
                <button type="button" class="pill-btn" id="level-switch">📶 Level</button>
                <button type="button" class="pill-btn" id="lang-switch">🌐 Language</button>
            </div>
        </div>

        <p class="instruction" id="instruction"></p>

        <div class="topics" id="topics"></div>

        <div class="word-bank">
            <p class="word-bank-label" id="bank-label"></p>
            <div class="word-tags" id="word-tags"></div>
        </div>

        <div id="sentences"></div>

        <div class="button-row">
            <button type="button" class="action check" id="check-btn"></button>
            <button type="button" class="action reset" id="reset-btn"></button>
            <button type="button" class="action fresh" id="new-btn"></button>
        </div>

        <div class="result" id="result"></div>
    </div>
</div>

    // STATE
    var lang = 'en';

    // ---------- Storage helpers (fail safely) ----------
    function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
    function load(key, fallback) {
        try { var v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    }

    // ---------- Speech ----------
    var canSpeak = 'speechSynthesis' in window;
    var voice = null;
    function pickVoice() {
        if (!canSpeak) return;
        var voices = window.speechSynthesis.getVoices();
        var gb = null, en = null;
        for (var i = 0; i < voices.length; i++) {
            var l = (voices[i].lang || '').toLowerCase().replace('_', '-');
            if (!gb && l === 'en-gb') gb = voices[i];
            if (!en && l.indexOf('en') === 0) en = voices[i];
        }
        voice = gb || en;
    }
    if (canSpeak) {
        pickVoice();
        window.speechSynthesis.onvoiceschanged = pickVoice;
    }
    function speak(text) {
        if (!canSpeak) return;
        try {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-GB';
            if (voice) u.voice = voice;
            // Slower for beginners, closer to normal speed for intermediate
            u.rate = level === 'intermediate' ? 0.9 : 0.8;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    // ---------- Text helpers ----------
    function t(key) { return UI[lang][key]; }

    // English text with the learner's language underneath (unless English only)
    function dual(english, translated) {
        var html = '<span>' + english + '</span>';
        if (lang !== 'en' && translated) html += '<span class="tr" dir="auto">' + translated + '</span>';
        return html;
    }
    function fullSentence(item) {
        var joiner = /^[.,!?]/.test(item.a) ? '' : ' ';
        return item.b + ' ' + item.w + joiner + item.a;
    }

    function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function renderTopics() {
        var wrap = document.getElementById('topics');
        wrap.innerHTML = '';
        for (var i = 0; i < TOPIC_ORDER.length; i++) {
            (function (key) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'topic-chip' + (key === topic ? ' active' : '');
                b.innerHTML = dual(UI.en.topics[key], UI[lang].topics[key]);
                b.addEventListener('click', function () {
                    topic = key;
                    renderTopics();
                    buildRound();
                });
                wrap.appendChild(b);
            })(TOPIC_ORDER[i]);
        }
    }

    function pickSet() {
        var pool = [];
        if (level === 'beginner') {
            for (var i = 0; i < BEGINNER_WORDS.length; i++) {
                if (topic === 'all' || BEGINNER_WORDS[i].t === topic) pool.push(BEGINNER_WORDS[i]);
            }
        } else {
            pool = INTERMEDIATE_WORDS.slice();
        }
        // Prefer words not seen in the last round at this level
        var lastKey = 'eslLast_' + level;
        var last = load(lastKey, []);
        var fresh = [], seen = [];
        var shuffled = shuffle(pool);
        for (var j = 0; j < shuffled.length; j++) {
            if (last.indexOf(shuffled[j].w) === -1) fresh.push(shuffled[j]); else seen.push(shuffled[j]);
        }
        var set = fresh.concat(seen).slice(0, Math.min(QUESTIONS_PER_ROUND[level], pool.length));
        store(lastKey, set.map(function (s) { return s.w; }));
        return set;
    }

    function buildRound() {
        currentSet = pickSet();
        clearResult();
        var isBeginner = level === 'beginner';

        // Word cards, alphabetical so the order gives nothing away
        var sorted = currentSet.slice().sort(function (x, y) { return x.w < y.w ? -1 : 1; });
        var tags = document.getElementById('word-tags');
        tags.innerHTML = '';
        for (var i = 0; i < sorted.length; i++) {
            (function (item) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'word-tag';
                var html = '';
                if (isBeginner) html += '<span class="emoji">' + item.e + '</span>';
                html += '<span class="word">' + item.w + '</span>';
                if (isBeginner && lang !== 'en') html += '<span class="tr" dir="auto">' + item.g[lang] + '</span>';
                if (canSpeak) html += '<span class="speak-hint">🔊</span>';
                b.innerHTML = html;
                b.title = UI.en.tapToHear;
                b.addEventListener('click', function () { speak(item.w); });
                tags.appendChild(b);
            })(sorted[i]);
        }

        // Dropdown options
        var opts = '<option value="">▼</option>';
        for (var k = 0; k < sorted.length; k++) {
            opts += '<option value="' + sorted[k].w + '">' + (isBeginner ? sorted[k].e + ' ' : '') + sorted[k].w + '</option>';
        }

        // Sentences
        var wrap = document.getElementById('sentences');
        wrap.innerHTML = '';
        for (var n = 0; n < currentSet.length; n++) {
            (function (idx, item) {
                var block = document.createElement('div');
                block.className = 'sentence-block';
                var row = '<div class="sentence-row">' +
                    '<span class="num">' + (idx + 1) + '.</span>';
                if (canSpeak) row += '<button type="button" class="speak-btn" id="say-' + idx + '" aria-label="Listen">🔊</button>';
                row += '<span>' + item.b + '</span>' +
                    '<select id="q-' + idx + '" aria-label="Choose a word">' + opts + '</select>' +
                    '<span>' + item.a + '</span>' +
                '</div>' +
                '<div class="feedback" id="fb-' + idx + '"></div>';
                block.innerHTML = row;
                wrap.appendChild(block);

                if (canSpeak) {
                    document.getElementById('say-' + idx).addEventListener('click', function () {
                        var sel = document.getElementById('q-' + idx);
                        // Once answered correctly, read the full sentence. Before that, pause for the gap.
                        if (sel.className === 'correct') speak(fullSentence(item));
                        else speak(item.b + ' ... ' + item.a.replace(/^[.,!?]\s*/, ''));
                    });
                }
                document.getElementById('q-' + idx).addEventListener('change', function () {
                    this.className = '';
                    var fb = document.getElementById('fb-' + idx);
                    fb.className = 'feedback';
                    fb.innerHTML = '';
                });
            })(n, currentSet[n]);
        }
    }

    function clearResult() {
        var r = document.getElementById('result');
        r.className = 'result';
        r.innerHTML = '';
    }

    // Check
    document.getElementById('check-btn').addEventListener('click', function () {
        var score = 0;
        var total = currentSet.length;
        var isBeginner = level === 'beginner';

        for (var i = 0; i < total; i++) {
            var item = currentSet[i];
            var sel = document.getElementById('q-' + i);
            var fb = document.getElementById('fb-' + i);
            var hint = (!isBeginner && item.h) ? '<span class="hint">💡 ' + item.h + '</span>' : '';

            if (sel.value === item.w) {
                score++;
                sel.className = 'correct';
                fb.className = 'feedback ok';
                fb.innerHTML = dual('✓ ' + UI.en.correct + ' <strong>' + fullSentence(item) + '</strong>', t('correct')) + hint;
            } else if (sel.value === '') {
                sel.className = 'incorrect';
                fb.className = 'feedback bad';
                fb.innerHTML = dual(UI.en.empty, t('empty'));
            } else {
                sel.className = 'incorrect';
                fb.className = 'feedback bad';
                fb.innerHTML = dual('✗ ' + UI.en.wrong, t('wrong')) + hint;
            }
        }

        var r = document.getElementById('result');
        if (score === total) {
            r.className = 'result all';
            r.innerHTML = dual('🎉 ' + UI.en.allRight, t('allRight'));
            speak('Well done!');
        } else {
            r.className = 'result some';
            var en = UI.en.score.replace('{s}', score).replace('{t}', total);
            var tr = t('score').replace('{s}', score).replace('{t}', total);
            r.innerHTML = dual(en, lang === 'en' ? '' : tr);
        }
        try { r.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
    });

    // Try again (same words)
    document.getElementById('reset-btn').addEventListener('click', function () {
        for (var i = 0; i < currentSet.length; i++) {
            var sel = document.getElementById('q-' + i);
            sel.value = '';
            sel.className = '';
            var fb = document.getElementById('fb-' + i);
            fb.className = 'feedback';
            fb.innerHTML = '';
        }
        clearResult();
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
    });

    // New words
    document.getElementById('new-btn').addEventListener('click', function () {
        buildRound();
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
    });

    // ==================================================================
    // START: skip the setup screens if the learner has been here before
    var savedLang = load('eslLang', null);
    var savedLevel = load('eslLevel', null);
    if (savedLevel === 'beginner' || savedLevel === 'intermediate') level = savedLevel;
    if (savedLang && UI[savedLang]) chooseLanguage(savedLang);
</script>

</body>
</html>
